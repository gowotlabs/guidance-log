<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개별학생교육지원 대장</title>
  <!-- 👇 아래 URL을 배포된 Apps Script 웹앱 주소로 교체하세요 (배포 새 버전 만들어도 이 exec 주소는 보통 안 바뀝니다) -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbyhCp8KaYtO-1IHMScbDIj5rlP0Lbfn1s5rwuIiCWx3vzqnnLxdfwPxpE6MWZdxeZPe/exec">
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }
    .box { text-align: center; color: #64748b; font-size: 0.9rem; }
    .spinner {
      width: 2rem; height: 2rem; border: 3px solid #c7d2fe; border-top-color: #4f46e5;
      border-radius: 50%; margin: 0 auto 0.8rem; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #4f46e5; font-weight: 600; }
  </style>
  <script>
    // 메타 리다이렉트(위 refresh)와 함께, 조금 더 빠르게 이동시키기 위한 JS 리다이렉트
    location.replace("https://script.google.com/macros/s/AKfycbyhCp8KaYtO-1IHMScbDIj5rlP0Lbfn1s5rwuIiCWx3vzqnnLxdfwPxpE6MWZdxeZPe/exec");

</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    개별학생교육지원 대장으로 이동 중입니다...<br>
    자동으로 안 넘어가면 <a href="https://script.google.com/macros/s/AKfycbyhCp8KaYtO-1IHMScbDIj5rlP0Lbfn1s5rwuIiCWx3vzqnnLxdfwPxpE6MWZdxeZPe/exec">여기를 눌러주세요</a>.
  </div>
