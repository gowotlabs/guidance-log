<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개별학생교육지원 대장</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }
    .card {
      background: white; border-radius: 1.5rem; padding: 2.5rem 2rem; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 380px; width: 90%;
    }
    h1 { font-size: 1.3rem; margin: 0 0 0.5rem; color: #1e293b; font-weight: 800; }
    p { color: #64748b; font-size: 0.9rem; margin: 0 0 1.5rem; line-height: 1.5; }
    a.btn {
      display: inline-block; background: #4f46e5; color: white; text-decoration: none;
      padding: 0.8rem 1.8rem; border-radius: 0.8rem; font-weight: 700; font-size: 0.95rem;
      transition: background .15s;
    }
    a.btn:hover { background: #4338ca; }
    .hint { margin-top: 1rem; font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 개별학생교육지원 대장</h1>
    <p>버튼을 누르면 실제 관리 페이지(Google Apps Script)가 새 탭에서 열립니다.</p>
    <!-- 👇 아래 URL을 배포된 Apps Script 웹앱 주소로 교체하세요 -->
    <a class="btn" id="launch-btn" href="https://script.google.com/macros/s/AKfycbyhCp8KaYtO-1IHMScbDIj5rlP0Lbfn1s5rwuIiCWx3vzqnnLxdfwPxpE6MWZdxeZPe/exec/exec" target="_blank" rel="noopener">
      관리 페이지 열기 →
    </a>
    <div class="hint">학교 구글 계정으로 로그인되어 있어야 접속됩니다.</div>
  </div>
</body>
</html>
